<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link th:href="@{../app.css}" rel="stylesheet">
</head>
<body>

    <main>
        <div class="imgCon">
            <img th:src="@{/app.png}" alt="banner">
        </div>
        <div class="appBody">
            <form th:action="@{/submit}" method="post" th:object="${linkForm}" onsubmit="disableButton()" id="urlForm">
                <div class="inputCon">

                    <input type="url" id="url" th:field="*{url}" placeholder="Enter Long URL">
                </div>
                <div>
                    <button type="submit" id="submitBtn">Submit</button>
                </div>
            </form>
            <div class="shortLink" th:if="${url!=null}">

                <p th:text="${message}">short</p>
                <p class="short">
                    <a th:href="${url}" th:ref="${url}" target="_blank">Open Link</a>
                </p>
            </div>
        </div>


        <script>
            function disableButton() {
                const btn = document.getElementById('submitBtn');
                const form = document.getElementById('urlForm');

                // Only disable if the form is actually valid (HTML5 validation)
                if (form.checkValidity()) {
                    btn.disabled = true;
                    btn.innerText = "Processing...";
                    btn.style.opacity = "0.5";
                    btn.style.cursor = "not-allowed";
                }
            }
        </script>


    </main>

</body>
</html>
